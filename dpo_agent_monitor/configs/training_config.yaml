# DPO Training Configuration
# Designed for small model + quick iteration during 10-day MTP

model:
  name: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"  # Small enough to train fast
  # Alternative: "Qwen/Qwen2.5-0.5B-Instruct"
  use_peft: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]

dataset:
  name: "trl-lib/ultrafeedback_binarized"
  # Alternative: "Anthropic/hh-rlhf"
  max_samples: 5000  # Keep small for fast iteration
  max_length: 512
  max_prompt_length: 256

training:
  num_train_epochs: 4      # Intentionally high to capture overfitting
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-5
  beta: 0.1                  # DPO beta parameter
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  bf16: true
  output_dir: "./outputs"
  save_strategy: "steps"
  save_steps: 50
  
logging:
  log_every_n_steps: 10      # Log metrics every 10 steps
  log_file: "./logs/training_run.jsonl"
  eval_every_n_steps: 50     # Run eval every 50 steps
  eval_samples: 200          # Number of eval samples

# Agent monitoring settings
agent:
  enabled: true            # Set true for live monitoring runs
  check_every_n_steps: 50    # Agent checks logs every 50 steps
  api_base_url: "https://api.groq.com/openai/v1"
  model: "llama-3.1-8b-instant"   # Best free model on Groq for reasoning
  # Alternatives: "meta-llama/llama-4-scout-17b-16e-instruct", "qwen/qwen3-32b"
  window_size: 20            # Number of recent log entries to show agent